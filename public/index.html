<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASTRA Boss Tracker</title>
  <style>
    :root {
      --bg-color: #0b0d18;
      --card-bg: #121629;
      --card-border: #1d223a;
      --accent-blue: #3d5afe;
      --accent-orange: #ffab40;
      --text-main: #ffffff;
      --text-muted: #7e87a7;
      --btn-bg: #1a2038;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; max-width: 1200px; margin: 0 auto; }

    /* Top Navigation Bar */
    .navbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; padding: 10px 0; }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.2rem; color: #a5b4fc; }
    .nav-tabs { display: flex; background: #161b33; padding: 4px; border-radius: 20px; border: 1px solid var(--card-border); }
    .tab { padding: 8px 18px; border-radius: 16px; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); cursor: pointer; text-transform: uppercase; }
    .tab.active { background: var(--accent-blue); color: #fff; }
    .status-badge { display: flex; align-items: center; gap: 6px; background: #0f2922; color: #00e676; padding: 4px 12px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; border: 1px solid #00e67644; }
    .status-dot { width: 8px; height: 8px; background: #00e676; border-radius: 50%; }

    /* Next Spawn Banner */
    .featured-card {
      background: linear-gradient(135deg, #181c35 0%, #101326 100%);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .boss-details { display: flex; align-items: center; gap: 20px; }
    .boss-avatar-ring {
      width: 80px; height: 80px; border-radius: 50%;
      border: 3px solid var(--accent-orange);
      display: flex; align-items: center; justify-content: center;
      background: #202644; font-size: 2rem;
    }
    .boss-meta-label { font-size: 0.75rem; color: var(--accent-orange); font-weight: 800; letter-spacing: 1px; margin-bottom: 4px; }
    .boss-title { font-size: 2rem; font-weight: 700; margin-bottom: 8px; }
    .tags { display: flex; gap: 8px; font-size: 0.75rem; }
    .tag { background: #202744; color: var(--text-muted); padding: 4px 10px; border-radius: 6px; }
    .tag.highlight { background: #1a2a4a; color: #64b5f6; }
    .spawn-timestamp { margin-top: 8px; font-size: 0.85rem; color: var(--text-muted); }

    .timer-display { text-align: right; }
    .huge-timer { font-size: 3.2rem; font-weight: 800; color: #ffffff; letter-spacing: -1px; }
    .timer-subtext { font-size: 0.75rem; color: var(--text-muted); letter-spacing: 1px; font-weight: 600; margin-top: 4px; }
    .btn-kill-featured { margin-top: 10px; background: #e53935; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }

    /* Bottom Main Grid */
    .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

    .panel { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 20px; }
    .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-size: 0.85rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }

    /* Spawn List */
    .spawn-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #0f1222; border-radius: 8px; margin-bottom: 8px; border: 1px solid #1a1f38; }
    .spawn-row-name { font-weight: 700; font-size: 0.95rem; }
    .spawn-row-time { font-weight: 700; color: #a5b4fc; font-size: 0.95rem; }

    /* Interval Grid */
    .interval-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .interval-btn { background: var(--btn-bg); border: 1px solid var(--card-border); border-radius: 8px; padding: 12px 10px; text-align: left; cursor: pointer; color: #8c98be; font-size: 0.8rem; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
    .interval-btn.selected { border-color: var(--accent-orange); color: var(--text-main); background: #252438; }
    .badge { background: #2a3152; color: #8c98be; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <div class="navbar">
    <div class="logo">⚡ ASTRA</div>
    <div class="nav-tabs">
      <div class="tab active">Tracker</div>
      <div class="tab">Hidden Class</div>
      <div class="tab">Relic</div>
    </div>
    <div class="status-badge">
      <div class="status-dot"></div> LIVE
    </div>
  </div>

  <!-- Featured Spawning Boss Banner -->
  <div class="featured-card" id="featured-card">
    <!-- Populated dynamically via JS -->
  </div>

  <!-- Bottom Grid Panels -->
  <div class="dashboard-grid">
    <!-- Today's Upcoming Spawns -->
    <div class="panel">
      <div class="panel-header">
        <span>🕒 Today</span>
      </div>
      <div id="spawn-list"></div>
    </div>

    <!-- Interval Filter Grid -->
    <div class="panel">
      <div class="panel-header">
        <span>🔄 Interval Filter</span>
      </div>
      <div class="interval-grid">
        <div class="interval-btn selected"><span>⏱ EVERY 10H</span> <span class="badge">2</span></div>
        <div class="interval-btn"><span>⏱ EVERY 18H</span> <span class="badge">1</span></div>
        <div class="interval-btn"><span>⏱ EVERY 21H</span> <span class="badge">1</span></div>
        <div class="interval-btn"><span>⏱ EVERY 24H</span> <span class="badge">3</span></div>
        <div class="interval-btn"><span>⏱ EVERY 29H</span> <span class="badge">2</span></div>
        <div class="interval-btn"><span>⏱ EVERY 32H</span> <span class="badge">2</span></div>
        <div class="interval-btn"><span>⏱ EVERY 35H</span> <span class="badge">3</span></div>
        <div class="interval-btn"><span>⏱ EVERY 37H</span> <span class="badge">1</span></div>
        <div class="interval-btn"><span>⏱ EVERY 48H</span> <span class="badge">3</span></div>
      </div>
    </div>
  </div>

  <script>
    async function loadBossTracker() {
      try {
        const res = await fetch('/api/bosses');
        const bosses = await res.json();
        if (!bosses || bosses.length === 0) return;

        // Sort bosses by soonest spawn time
        bosses.sort((a, b) => new Date(a.nextSpawn) - new Date(b.nextSpawn));

        // Featured Next Boss (First item in sorted array)
        const nextBoss = bosses[0];
        const now = new Date();
        const spawnTime = new Date(nextBoss.nextSpawn);
        const diffMs = spawnTime - now;

        let timeFormatted = "SPAWNED";
        if (diffMs > 0) {
          const h = Math.floor(diffMs / (1000 * 60 * 60));
          const m = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
          timeFormatted = `${h}h ${m}m`;
        }

        const dateOptions = { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
        
        document.getElementById('featured-card').innerHTML = `
          <div class="boss-details">
            <div class="boss-avatar-ring">👹</div>
            <div>
              <div class="boss-meta-label">● NEXT SPAWN</div>
              <div class="boss-title">${nextBoss.name}</div>
              <div class="tags">
                <span class="tag">Lv.${nextBoss.level}</span>
                <span class="tag">${nextBoss.location}</span>
                <span class="tag highlight">INTERVAL</span>
              </div>
              <div class="spawn-timestamp">${spawnTime.toLocaleDateString('en-US', dateOptions)}</div>
            </div>
          </div>
          <div class="timer-display">
            <div class="huge-timer">${timeFormatted}</div>
            <div class="timer-subtext">TIME REMAINING</div>
            <button class="btn-kill-featured" onclick="markKilled(${nextBoss.id})">Mark Dead</button>
          </div>
        `;

        // Render Today's Spawn List
        const spawnListContainer = document.getElementById('spawn-list');
        spawnListContainer.innerHTML = '';
        
        bosses.forEach(boss => {
          const bTime = new Date(boss.nextSpawn);
          const timeStr = bTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          
          const row = document.createElement('div');
          row.className = 'spawn-row';
          row.innerHTML = `
            <span class="spawn-row-name">${boss.name}</span>
            <span class="spawn-row-time">${timeStr}</span>
          `;
          spawnListContainer.appendChild(row);
        });

      } catch (err) {
        console.error("Failed to load boss data:", err);
      }
    }

    async function markKilled(id) {
      await fetch(`/api/bosses/${id}/kill`, { method: 'POST' });
      loadBossTracker();
    }

    setInterval(loadBossTracker, 5000);
    loadBossTracker();
  </script>
</body>
</html>
