<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASTRA Boss Tracker (24h)</title>
  <style>
    :root {
      --bg: #070913;
      --card-bg: #0e1120;
      --card-border: #181d33;
      --accent-orange: #ff7043;
      --accent-blue: #304ffe;
      --text-muted: #647196;
      --text-light: #9faecb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: #ffffff; padding: 16px; max-width: 1200px; margin: 0 auto; }

    /* Top Bar */
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 1.1rem; color: #7c4dff; }
    .nav-btn { background: #181c33; color: #a5b4fc; padding: 6px 20px; border-radius: 16px; font-size: 0.8rem; font-weight: 700; border: 1px solid #282f52; }
    .live-badge { background: #08291b; color: #00e676; padding: 4px 12px; border-radius: 12px; font-size: 0.75rem; font-weight: 800; border: 1px solid #00e67644; }

    /* Main Featured Card */
    .featured-box {
      background: linear-gradient(180deg, #121528 0%, #0c0e1a 100%);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .boss-details { display: flex; align-items: center; gap: 16px; }
    .boss-icon { width: 64px; height: 64px; border-radius: 50%; border: 2px solid var(--accent-orange); background: #1a2038; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; }
    .meta-tag { font-size: 0.7rem; color: var(--accent-orange); font-weight: 800; letter-spacing: 1px; margin-bottom: 2px; }
    .boss-name-title { font-size: 1.8rem; font-weight: 800; }
    .badge-row { display: flex; gap: 6px; margin-top: 6px; }
    .pill { background: #1a2038; color: var(--text-light); font-size: 0.7rem; padding: 3px 8px; border-radius: 4px; font-weight: 600; }
    .pill.active { background: #0d2847; color: #40c4ff; }
    .date-str { font-size: 0.8rem; color: #a5b4fc; font-weight: 700; margin-top: 6px; }

    .timer-side { text-align: right; }
    .countdown-text { font-size: 2.8rem; font-weight: 900; color: var(--accent-orange); font-variant-numeric: tabular-nums; }
    .timer-label { font-size: 0.7rem; color: var(--text-muted); font-weight: 700; letter-spacing: 1px; }

    /* Layout */
    .grid-container { display: grid; grid-template-columns: 320px 1fr; gap: 16px; }
    .panel { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 16px; }
    .panel-title { font-size: 0.75rem; color: var(--text-muted); font-weight: 800; letter-spacing: 1px; margin-bottom: 12px; }

    /* Timeline Row */
    .spawn-row { display: flex; justify-content: space-between; padding: 10px 12px; background: #090b16; border-radius: 6px; margin-bottom: 6px; font-size: 0.85rem; border: 1px solid #13172b; }
    .spawn-name { font-weight: 700; }
    .spawn-time { font-weight: 700; color: var(--accent-orange); }

    /* Interval Grid */
    .interval-columns { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    .interval-card { background: #090b16; border: 1px solid var(--card-border); border-radius: 8px; padding: 12px; }
    .interval-card-header { display: flex; justify-content: space-between; font-size: 0.75rem; font-weight: 800; color: #40c4ff; margin-bottom: 10px; border-bottom: 1px solid #14192d; padding-bottom: 6px; }
    .interval-boss-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 0.8rem; }
    .interval-boss-name { font-weight: 600; color: #ffffff; }
    .interval-boss-time { font-size: 0.75rem; color: var(--text-muted); }
    .btn-kill-sm { background: #d32f2f; color: white; border: none; padding: 3px 8px; border-radius: 4px; font-size: 0.65rem; cursor: pointer; font-weight: 700; margin-left: 6px; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="brand">⚡ ASTRA</div>
    <div class="nav-btn">TRACKER</div>
    <div class="live-badge">● LIVE</div>
  </div>

  <!-- Featured Banner -->
  <div class="featured-box" id="featured-card"></div>

  <div class="grid-container">
    <!-- Left: Timeline -->
    <div class="panel">
      <div class="panel-title">🕒 TODAY (24H FORMAT)</div>
      <div id="spawn-timeline"></div>
    </div>

    <!-- Right: Interval Groups -->
    <div class="panel">
      <div class="panel-title">🔄 INTERVAL COOLDOWNS</div>
      <div class="interval-columns" id="interval-grid"></div>
    </div>
  </div>

  <script>
    let localBosses = [];

    // Helper function to format JS dates into 24-hour time HH:MM
    function format24Hour(dateObj) {
      const h = String(dateObj.getHours()).padStart(2, '0');
      const m = String(dateObj.getMinutes()).padStart(2, '0');
      return `${h}:${m}`;
    }

    async function fetchBossData() {
      try {
        const res = await fetch('/api/bosses');
        localBosses = await res.json();
        renderDashboard();
      } catch (e) {
        console.error("Error fetching bosses:", e);
      }
    }

    function renderDashboard() {
      if (!localBosses || localBosses.length === 0) return;

      const now = new Date();

      localBosses.forEach(boss => {
        boss.nextSpawnDate = new Date(boss.nextSpawn);
      });

      // Sort by soonest spawn
      localBosses.sort((a, b) => a.nextSpawnDate - b.nextSpawnDate);

      // Featured Next Boss
      const nextBoss = localBosses[0];
      const diffMs = nextBoss.nextSpawnDate - now;

      let timerText = "00m 00s";
      if (diffMs > 0) {
        const h = Math.floor(diffMs / (1000 * 60 * 60));
        const m = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
        const s = Math.floor((diffMs % (1000 * 60)) / 1000);
        timerText = h > 0 ? `${h}h ${m}m ${s}s` : `${m}m ${s}s`;
      } else {
        timerText = "SPAWNED";
      }

      const spawnTime24 = format24Hour(nextBoss.nextSpawnDate);

      document.getElementById('featured-card').innerHTML = `
        <div class="boss-details">
          <div class="boss-icon">👹</div>
          <div>
            <div class="meta-tag">● NEXT SPAWN</div>
            <div class="boss-name-title">${nextBoss.name}</div>
            <div class="badge-row">
              <span class="pill">Lv.${nextBoss.level}</span>
              <span class="pill">${nextBoss.location}</span>
              <span class="pill active">EVERY ${nextBoss.intervalHours}H</span>
            </div>
            <div class="date-str">Spawn Time: ${spawnTime24}</div>
          </div>
        </div>
        <div class="timer-side">
          <div class="countdown-text">${timerText}</div>
          <div class="timer-label">TIME REMAINING</div>
          <button class="btn-kill-sm" style="padding:6px 12px; margin-top:8px;" onclick="killBoss(${nextBoss.id})">Mark Dead</button>
        </div>
      `;

      // Timeline (24-hour format)
      const timelineContainer = document.getElementById('spawn-timeline');
      timelineContainer.innerHTML = '';
      localBosses.slice(0, 8).forEach(boss => {
        const time24 = format24Hour(boss.nextSpawnDate);
        const row = document.createElement('div');
        row.className = 'spawn-row';
        row.innerHTML = `
          <span class="spawn-name">${boss.name}</span>
          <span class="spawn-time">${time24}</span>
        `;
        timelineContainer.appendChild(row);
      });

      // Interval Cooldowns
      const intervalGrid = document.getElementById('interval-grid');
      intervalGrid.innerHTML = '';

      const grouped = {};
      localBosses.forEach(boss => {
        const key = `EVERY ${boss.intervalHours}H`;
        if (!grouped[key]) grouped[key] = [];
        grouped[key].push(boss);
      });

      Object.keys(grouped).forEach(key => {
        const card = document.createElement('div');
        card.className = 'interval-card';

        let bossRowsHtml = '';
        grouped[key].forEach(boss => {
          const bossDiff = boss.nextSpawnDate - now;
          let remainingStr = "Ready";
          if (bossDiff > 0) {
            const bh = Math.floor(bossDiff / (1000 * 60 * 60));
            const bm = Math.floor((bossDiff % (1000 * 60 * 60)) / (1000 * 60));
            remainingStr = bh > 0 ? `${bh}h ${bm}m` : `${bm}m`;
          }

          bossRowsHtml += `
            <div class="interval-boss-item">
              <div>
                <span class="interval-boss-name">${boss.name}</span>
              </div>
              <div>
                <span class="interval-boss-time">${remainingStr}</span>
                <button class="btn-kill-sm" onclick="killBoss(${boss.id})">Kill</button>
              </div>
            </div>
          `;
        });

        card.innerHTML = `
          <div class="interval-card-header">
            <span>⏱ ${key}</span>
            <span>${grouped[key].length}</span>
          </div>
          ${bossRowsHtml}
        `;
        intervalGrid.appendChild(card);
      });
    }

    async function killBoss(id) {
      await fetch(`/api/bosses/${id}/kill`, { method: 'POST' });
      fetchBossData();
    }

    setInterval(renderDashboard, 1000);
    setInterval(fetchBossData, 10000);

    fetchBossData();
  </script>
</body>
</html>
